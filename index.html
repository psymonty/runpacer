<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pacer clock">
<title>Pacer clock</title>
<style>
:root{--bg:#EEF2F5;--card:#FFFFFF;--ink:#10202C;--mute:#5B6B78;--line:#CBD5DD;--act:#0A58E0;--actink:#FFFFFF;--ok:#12703A;--late:#EB6200;--red:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B141B;--card:#15222C;--ink:#EEF3F7;--mute:#97A8B5;--line:#2A3B48;--act:#4C8DFF;--actink:#06111C;--ok:#4FCB86;--late:#FFA229;--red:#FF7A70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B141B;--card:#15222C;--ink:#EEF3F7;--mute:#97A8B5;--line:#2A3B48;--act:#4C8DFF;--actink:#06111C;--ok:#4FCB86;--late:#FFA229;--red:#FF7A70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
h1{font-size:20px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
select,input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;background:var(--act);color:var(--actink);width:100%;font-size:20px}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:16px;font-weight:600;padding:12px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.plan{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px;margin:0;padding:0;list-style:none}
.plan li{display:contents}.plan span:last-child{font-weight:700}
#el{font-size:26px;font-weight:800;line-height:1.1}
.sub{color:var(--mute);font-size:14px;text-align:center}
.lab{font-size:17px;font-weight:700;color:var(--mute);margin-top:8px}
#nm{font-size:min(8.5vw,36px);font-weight:900;line-height:1.1}
#cd{font-size:min(18vw,76px);font-weight:900;line-height:1;letter-spacing:-.02em;white-space:nowrap}
#cd.sm{font-size:min(15vw,64px)}
#pc{font-size:min(18vw,76px);font-weight:900;line-height:1;letter-spacing:-.02em;white-space:nowrap}
#pc.sm{font-size:min(16vw,66px)}
#pc small{font-size:.38em;font-weight:800;color:var(--mute);letter-spacing:0}
#ter{font-size:min(5.2vw,21px);font-weight:700;color:var(--mute);margin-top:4px}
#dist{font-size:30px;font-weight:700;margin-top:8px}
#st{font-size:min(10vw,44px);font-weight:900;line-height:1.1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 12px;text-align:center;border-radius:14px;padding:10px;border:3px solid var(--line);background:var(--card)}
#st.ok{border-color:var(--ok);color:var(--ok)}
#st.ease{border-color:var(--late);color:var(--late)}
#st.fast{border-color:var(--red);color:var(--red)}
#st .n{font-size:inherit}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 .card{padding:10px 4px}
.grid3 .k{font-size:13px;color:var(--mute);font-weight:600}
.grid3 .v{font-size:26px;font-weight:800;line-height:1.2;white-space:nowrap}
.ok{color:var(--ok)}.late{color:var(--late)}
#pass{font-size:30px;padding:26px 14px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.grid3 .dv{font-size:min(7.5vw,30px);font-weight:900;line-height:1.2;color:var(--mute)}
.dv small{display:block;font-size:14px;font-weight:700;line-height:1.1;margin-top:2px}
.dv.c-ok{color:var(--ok)}.dv.c-ease{color:var(--late)}.dv.c-fast{color:var(--red)}
#lgl{margin-bottom:-6px}
.c-ok{color:var(--ok)}.c-ease{color:var(--late)}.c-fast{color:var(--red)}
#sc{font-size:min(22vw,88px);font-weight:900;line-height:1}
#sc small{font-size:.35em;font-weight:800;color:var(--mute)}
#sl{font-size:24px;font-weight:800;margin-top:2px}
#s2,#s3{font-size:14px;margin-top:6px}
.fin{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.fin li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.fin .r1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:16px}
.fin .r1 span:last-child{white-space:nowrap}
.fin .r2{font-size:14px;color:var(--mute);margin-top:2px}
.fin .r2 b{font-weight:800}
.btns{display:flex;gap:10px;margin-top:auto;padding-top:24px}
#run{min-height:calc(100vh + 66px);min-height:calc(100dvh + 66px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="setup">
<h1>Pacer clock</h1>
<div class="card" style="margin-top:12px">
<label for="course">Course</label>
<select id="course"></select>
<div class="row" id="tin" style="margin-top:12px"></div>
</div>
<div class="card" style="margin-top:12px"><ul class="plan" id="prev"></ul></div>
<button id="go" style="margin-top:12px">Start clock</button>
<p class="sub">Tap Start at the gun. The clock keeps time even if the screen locks.</p>
</section>

<section id="run" hidden style="display:flex;flex-direction:column;gap:12px;flex:1">
<div class="sub" id="meta"></div>
<div id="st"></div>
<div class="card" style="text-align:center">
<div class="sub" id="nl" hidden style="font-size:18px;font-weight:700">Finished</div>
<div id="nm"></div>
<div class="lab" id="l1">in</div>
<div id="cd"></div>
<div class="lab" id="l2">Segment target pace</div>
<div id="pc"></div>
<div id="dist"></div>
<div id="ter"></div>
</div>
<button id="pass">Passed</button>
<div class="grid3">
<div class="card"><div class="k">Time /mins</div><div class="v" id="el">0:00</div></div>
<div class="card"><div class="k" id="k2">Dist /km</div><div class="v" id="d2">0.00 km</div></div>
<div class="card"><div class="k" id="k3">Avg /km</div><div class="v" id="p3">–</div></div>
</div>
<div class="sub" id="lgl">Last 3 segments vs plan pace</div>
<div class="grid3" id="log"></div>
<div class="card" id="score" hidden style="text-align:center">
<div class="sub" style="font-size:16px;font-weight:700">Pacing score</div>
<div id="sc"></div><div id="sl"></div>
<div class="sub" id="s2"></div><div class="sub" id="s3"></div>
</div>
<ul class="fin" id="fin" hidden></ul>
<div class="btns"><button class="sec" id="undo">Undo</button><button class="sec" id="reset">Reset</button></div>
</section>
</main>

sot:{n:"Southampton parkrun",p:[["Start",0,0],["Left turn near park exit",.457,.0954],["Start of Cemetery Lake",.857,.1715],["Left turn after lake",1.064,.2123],["Start junction",1.302,.2599],["Cowherds Inn car park",1.622,.327],["Cross-paths after boating lake",2.163,.4416],["Left turn at top of hill",2.677,.5515],["Point-out cross-paths",3.066,.6266],["Park exit",3.769,.759],["Start of lake",4.169,.835],["Left turn after Cemetery Lake",4.376,.8758],["Start junction",4.609,.9223],["Left turn to finish",4.931,.9884],["Finish",5,1]]},
eas:{n:"Eastleigh parkrun",p:[["Start",0,0],["Lap 1 NE corner (left)",.326,.0652],["Lap 1 SW corner (left)",.83,.166],["Lap 1 N hairpin (right)",1.217,.2434],["Lap 1 finish junction",1.581,.3162],["Lap 1 done – start line",1.709,.3418],["Lap 2 NE corner (left)",2.036,.4072],["Lap 2 SW corner (left)",2.54,.508],["Lap 2 N hairpin (right)",2.926,.5852],["Lap 2 finish junction",3.291,.6582],["Lap 2 done – start line",3.419,.6838],["Lap 3 NE corner (left)",3.745,.749],["Lap 3 SW corner (left)",4.249,.8498],["Lap 3 N hairpin (right)",4.635,.927],["Finish",5,1]]},

};
var KEY="pacerClock1",S=load()||{c:"wm",m:30,s:0,t0:null,p:[],done:false,fin:0},wl=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function f(s,fl){s=fl?Math.floor(s):Math.round(s);if(s<0)s=0;var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+":"+(m<10?"0":"")+m:m)+":"+(r<10?"0":"")+r}
function ts(){return S.m*60+S.s}
function P(){return C[S.c].p}
function tg(i){return P()[i][2]*ts()}
async function lock(){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",function(){if(S.t0&&!S.done&&document.visibilityState==="visible")lock()});

function setup(){
var sel=$("course");
if(!sel.options.length){for(var k in C){var o=document.createElement("option");o.value=k;o.textContent=C[k].n;sel.appendChild(o)}}
sel.value=S.c;buildInputs();preview();
}
/* The time boxes only exist on the setup screen. Removing them on Start clears iOS's typing-undo history, so a shake while running can no longer pop up "Undo Typing". */
function buildInputs(){
$("tin").innerHTML='<div><label for="min">Target minutes</label><input id="min" type="number" inputmode="numeric" min="10" max="600" autocomplete="off"></div><div><label for="sec">Seconds</label><input id="sec" type="number" inputmode="numeric" min="0" max="59" autocomplete="off"></div>';
$("min").value=S.m;$("sec").value=S.s;
$("min").addEventListener("input",num);$("sec").addEventListener("input",num);
}
function dropInputs(){var a=document.activeElement;if(a&&a.blur)a.blur();$("tin").innerHTML=""}
function preview(){
var h="",p=P();
for(var i=0;i<p.length;i++)h+="<li><span>"+p[i][0]+"</span><span>"+f(tg(i))+"</span></li>";
$("prev").innerHTML=h;
}
var EASE=10,FAST=5,EASEP=6,FASTP=3; /* EASEP/FASTP: % faster / % slower than planned segment pace before orange / red (about the same as 10 s / 5 s over a typical ~170 s segment) */ /* seconds ahead before "ease off"; seconds behind before "speed up" */
function view(){
var run=!!S.t0;
$("setup").hidden=run;$("run").hidden=!run;
if(!run){setup();return}
dropInputs();
EASE=C[S.c].e||10;FAST=C[S.c].f||5;
var p=P(),n=S.p.length,idx=n+1,last=p.length-1;
$("meta").textContent=C[S.c].n+" · target "+f(ts());
var st=$("st");
/* last-waypoint stats (n = index of last waypoint passed, 0 = start) */
var kmDone=p[n][1],tDone=n?S.p[n-1]/1000:0;
$("k2").textContent="Dist /km";
$("d2").textContent=kmDone.toFixed(2);
$("k3").textContent="Avg /km";
$("p3").textContent=(n&&kmDone>0)?f(tDone/kmDone):"–";
if(S.done){
$("nm").textContent="Final time "+f(S.fin/1000,1);
var d=S.fin/1000-ts(),r0=Math.round(d);
$("l1").hidden=true;$("l2").hidden=true;$("cd").textContent="";$("pc").textContent="";$("dist").textContent="";$("ter").textContent="";
st.className=Math.abs(r0)<=3?"ok":(d<0?"ease":"fast");
st.innerHTML=Math.abs(r0)<2?B("ON TARGET"):B(d<0?"EARLY":"LATE",Math.abs(r0));
$("pass").hidden=true;
}else{
$("l1").hidden=false;$("l2").hidden=false;
$("nm").textContent=p[idx][0];
var km=p[idx][1]-p[idx-1][1];
/* Target pace = this segment's planned pace plus a share of the time gap, spread over about 10% of the course (at least this segment, at most what is left) and limited to ±10% of planned pace. So a big gap never demands an impossible pace. */
if(km>0){var pp=(tg(idx)-tg(n))/km,L=Math.min(Math.max(km,p[last][1]*.1),p[last][1]-p[n][1]),tp=pp-(tDone-tg(n))/L;
tp=Math.max(pp*.9,Math.min(pp*1.1,tp));var pcs=f(tp);$("pc").innerHTML=pcs+" <small>/km</small>";$("pc").className=pcs.length>=5?"sm":""}
else{$("pc").className="";$("pc").innerHTML=""}
$("dist").textContent="for "+Math.round(km*1000)+" m";$("ter").textContent=p[idx][3]||"";
$("pass").hidden=false;$("pass").textContent=idx===last?"Finish":"Passed";

var dl=Math.round(tDone-tg(n)),ab=Math.abs(dl);

}

$("nl").hidden=!S.done;if(!S.done)$("score").hidden=true;
gl.hidden=S.done;$("lgl").hidden=S.done;fl.hidden=!S.done;
if(S.done){
var h="";
for(var i=n;i>=1;i--){var sg=seg(i),cr=Math.round(S.p[i-1]/1000-tg(i)),cc=cr<-EASE?"ease":(cr>FAST?"fast":"ok");
h+='<li><div class="r1"><span>'+p[i][0]+" · "+f(S.p[i-1]/1000,1)+'</span><span class="c-'+cc+'">'+(Math.abs(cr)<2?"on plan":Math.abs(cr)+" s "+(cr<0?"ahead":"behind"))+'</span></div>'
+'<div class="r2">'+f(sg.ap)+" /km (plan "+f(sg.pp)+") · <b class=\"c-"+sg.c+'">'+sg.t+"</b></div></li>"}

h2+='<div class="card"><div class="dv c-'+q.c+'">'+q.u+'<small>'+(q.c=="ease"?"fast":q.c=="fast"?"slow":"on pace")+'</small></div></div>'}

}
/* segment i = from waypoint i-1 to waypoint i. t = % vs planned pace (+ slower, − faster); c = colour class from the % off planned pace */
/* Pacing score (0-100) = 50% evenness + 20% schedule + 30% finish.

function score(n){
var p=P(),T=ts();
if(n<3){$("score").hidden=true;return}
var ch=[],a=0,i,th=[0,0,0],tn=[0,0,0];
for(i=1;i<=n;i++){if(p[i][1]-p[a][1]>=.5||i==n){ch.push([a,i]);a=i}}
if(ch.length>1&&p[n][1]-p[ch[ch.length-1][0]][1]<.5){var l=ch.pop();ch[ch.length-1][1]=l[1]}
var sw=0,sd=0,sa=0,dr=0;
for(var q=0;q<ch.length;q++){var x=ch[q][0],y=ch[q][1],km=p[y][1]-p[x][1],ac=(S.p[y-1]-(x?S.p[x-1]:0))/1000,pc=(ac/(tg(y)-tg(x))-1)*100;
sw+=km;sd+=Math.max(0,Math.abs(pc)-1)*km;sa+=Math.abs(pc)*km}
for(i=1;i<=n;i++){var g=seg(i),k=Math.min(2,Math.floor((i-1)*3/n));th[k]+=g.pc*g.km;tn[k]+=g.km;dr+=Math.abs(S.p[i-1]/1000-tg(i))}
var ev=Math.max(0,100-15*sd/sw),sch=Math.max(0,100-40*(dr/n/T*100)),fd=(S.fin/1000-T)/T*100,fn=Math.max(0,100-(fd<0?-30*fd:60*fd));
var sc=Math.round(.5*ev+.2*sch+.3*fn),c=sc>=80?"ok":(sc>=50?"ease":"fast");
var lb=sc>=90?"Excellent":sc>=80?"Very good":sc>=65?"Good":sc>=50?"Fair":"Erratic";
var sg=function(x){return(x<0?"−":"+")+Math.abs(x).toFixed(1)+"%"};
$("sc").className="c-"+c;$("sl").className="c-"+c;
$("sc").innerHTML=sc+"<small> /100</small>";$("sl").textContent=lb;
$("s2").textContent="Evenness "+Math.round(ev)+" · Schedule "+Math.round(sch)+" · Finish "+Math.round(fn);
$("s3").textContent="Pace vs plan: start "+sg(th[0]/tn[0])+" · middle "+sg(th[1]/tn[1])+" · end "+sg(th[2]/tn[2])+" (− faster, + slower)";
$("score").hidden=false;
}
function seg(i){
var p=P(),a=(S.p[i-1]-(i>1?S.p[i-2]:0))/1000,pl=tg(i)-tg(i-1),km=p[i][1]-p[i-1][1],pc=(a/pl-1)*100,ap=Math.abs(pc);
var u=(ap<10?ap.toFixed(1):Math.round(ap))+"%",t=(pc<0?"−":"+")+u;
return{pc:pc,km:km,t:t,u:u,c:pc<-EASEP?"ease":(pc>FASTP?"fast":"ok"),ap:a/km,pp:pl/km}
}
function B(l,n){return"<span>"+l+"</span>"+(n?'<span class="n">'+n+" s</span>":"")}
function tick(){
if(!S.t0)return;
var e=S.done?S.fin/1000:(Date.now()-S.t0)/1000;
$("el").textContent=f(e,1);
if(!S.done){var d=tg(S.p.length+1)-e,t=d>=0?f(d,1):"−"+f(-d,1);$("cd").textContent=t;$("cd").className=(d>=0?"":"late")+(t.length>=6?" sm":"")}
}
$("course").addEventListener("change",function(){var o=C[S.c],n=C[this.value];S.c=this.value;if(!!o.d!==!!n.d){S.m=n.d||30;S.s=0;buildInputs()}save();preview()});
function num(){S.m=Math.min(600,Math.max(10,parseInt($("min").value,10)||30));S.s=Math.min(59,Math.max(0,parseInt($("sec").value,10)||0));save();preview()}
$("go").addEventListener("click",function(){num();S.t0=Date.now();S.p=[];S.done=false;S.fin=0;save();lock();view()});
var lastPass=0;
function passNow(){
if(S.done)return;
var now=Date.now();if(now-lastPass<500)return;lastPass=now;
var e=now-S.t0;S.p.push(e);
if(S.p.length>=P().length-1){S.done=true;S.fin=e;if(wl){try{wl.release()}catch(x){}}}
save();view();
}
/* Act on touch-down (the button also has touch-action:none), so a tap with a little finger movement is never read as a scroll. The click handler is only for keyboard activation (detail 0). */
$("pass").addEventListener("pointerdown",function(ev){ev.preventDefault();passNow()});
$("pass").addEventListener("click",function(ev){if(ev.detail===0)passNow()});
$("undo").addEventListener("click",function(){
if(!S.p.length)return;
S.p.pop();if(S.done){S.done=false;S.fin=0;lock()}save();view();
});
var rt=null;
$("reset").addEventListener("click",function(){
var b=this;
if(!rt){b.textContent="Tap again to reset";rt=setTimeout(function(){rt=null;b.textContent="Reset"},3000);return}
clearTimeout(rt);rt=null;b.textContent="Reset";
S.t0=null;S.p=[];S.done=false;S.fin=0;save();if(wl){try{wl.release()}catch(x){}}view();
});
setInterval(tick,200);
view();
if(S.t0&&!S.done)lock();
</script>
